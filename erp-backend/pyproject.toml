[project]
name = "oscenia-erp-backend"
version = "0.1.0"
description = "Finance backend for the Oscenia ERP — double-entry ledger, AR/AP, assets, project P&L"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Capped below 2.1: the suite is proven on 2.0, and 2.1 changes the typing of Select and
    # more. Moving up is its own change, with the full suite and mypy run against it.
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30",
    "greenlet>=3.1",            # SQLAlchemy async needs this explicitly on some platforms
    "alembic>=1.14",
    "pydantic[email]>=2.10",   # EmailStr validates the login address at the boundary
    "pydantic-settings>=2.7",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "apscheduler>=3.11",
    "python-multipart>=0.0.20", # multipart uploads, phase 6
    "pillow>=11.0",             # re-encode uploaded images: resize, strip EXIF, refuse non-images
    "httpx>=0.28",              # calls the AI service that writes meeting minutes, and Google
    "cryptography>=43",         # encrypts the stored Google refresh tokens
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    # Lint and type tools are pinned: a new release adds rules, and an unpinned CI goes red
    # on a pull request that changed nothing. Bump them deliberately, in their own commit.
    "ruff==0.16.6",
    "mypy==2.3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Each test gets its own loop. The session-scoped engine copes because it uses NullPool —
# see the note in tests/conftest.py.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "phase0: scaffold",
    "phase1: ledger core",
    "phase2: auth & RBAC",
    "phase3: statements & reports",
    "phase4: accounts receivable",
    "phase5: accounts payable",
    "phase6: cash operations",
    "phase7: fixed assets & payroll",
    "phase8: scheduler & hardening",
    "slow: full-life depreciation runs and similar",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Autogenerated by Alembic and not hand-maintained. The hand-written trigger SQL inside
# each migration is reviewed on the way in; reformatting the generated table DDL around it
# would only obscure the diff.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ"]
# DTZ is deliberate: it flags naive datetime and date.today(), which this codebase
# forbids outright. All time comes from app.core.clock. See docs 01-architecture.md.

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole dependency system is a call in an argument default. These are
# evaluated once at import and treated as immutable markers, which is exactly the case
# B008 exists to allow for.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Form",
    "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
"app/core/clock.py" = ["DTZ011"]   # the one place allowed to ask the OS for the date
# SIM300 reads an uppercase constant as the "literal" side, so it rewrites
# `assert MATERIALITY == Decimal("1.00")` into an actual Yoda condition. The ported
# assertion suite is thousands of `assert actual == expected`; keep them readable.
"tests/*" = ["DTZ", "SIM300"]
# The chat tests import the shared `world` fixture from tests/chat_world.py; naming it as a
# parameter then reads to ruff as redefining the import.
"tests/test_chat_*.py" = ["F811"]
"tests/test_notifications.py" = ["F811"]
"tests/test_workspace_*.py" = ["F811"]
"tests/test_search_personal.py" = ["F811"]

[tool.mypy]
python_version = "3.12"
plugins = []
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["alembic/"]

# APScheduler ships no py.typed marker, so strict mode cannot see through it. Silenced for
# that package only — narrowing this to the one dependency rather than relaxing the setting
# keeps the rest of the codebase strict.
[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
