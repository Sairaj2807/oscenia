[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# The URL is read from app.core.config in alembic/env.py so there is exactly one place
# that knows the connection string. Left blank deliberately.
sqlalchemy.url =

# Readable, sortable filenames: 0001_create_ledger_core.py
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
