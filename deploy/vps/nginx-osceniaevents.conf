# PROPOSED replacement for /etc/nginx/sites-available/osceniaevents. NOT APPLIED YET.
#
# Keep the lines Certbot manages (the `listen 443 ssl` block, ssl_certificate*, include,
# ssl_dhparam, and the port-80 redirect server). Only the `root` and `location` parts change.
# Test with `nginx -t`, then `systemctl reload nginx` (a reload, never a restart: other sites
# share this nginx). Rollback = put the old file back and reload.
#
# Layout built by deploy/vps/ship-static.sh (/var/www/oscenia/site is a symlink to releases/<timestamp>):
#   /var/www/oscenia/site/        the marketing site  (website/dist)
#   /var/www/oscenia/site/erp/    the ERP app         (erp-frontend/dist, built with base /erp/)

server {
    server_name osceniaevents.com www.osceniaevents.com;

    root /var/www/oscenia/site;
    index index.html;

    # Content-hashed bundles never change.
    location ~* ^/(assets|erp/assets)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The ERP is a single-page app under /erp/.
    location /erp/ {
        try_files $uri $uri/ /erp/index.html;
    }

    # The API runs on localhost only (systemd: oscenia-api). Nothing but nginx can reach it.
    location /api/ {
        client_max_body_size 210m;       # invitation videos are capped at 200 MB by the API
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Live chat (WebSocket).
    location /api/v1/chat/ws {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8010/health;
        proxy_set_header Host $host;
    }

    # The site's own pages. public/about/ and public/services/ are real folders (videos, images)
    # with the same names as the routes, so without this a request for /about/ hit the folder and
    # answered 403 instead of the app. (The old config had the same fault.)
    location ~ ^/(about|services|contact)/?$ {
        try_files /index.html =404;
    }

    # /erp (no slash) must reach the app, not the marketing site's fallback.
    location = /erp {
        return 301 /erp/;
    }

    # Everything else is a client-side route of the marketing site (/services/<slug>, 404 page…).
    location / {
        try_files $uri $uri.html /index.html;
    }

    # --- managed by Certbot: keep as it is on the server --------------------------------
    # listen [::]:443 ssl ipv6only=on;
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/osceniaevents.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/osceniaevents.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
