# Checks every pull request into main, and main itself after a merge.
#
# Two independent jobs, so a frontend failure never hides a backend one:
#   backend  — ruff, mypy (strict) and the full pytest suite against real Postgres 16
#   frontend — the prototype's verify suites, the render check and a production build
#
# The backend suite needs real Postgres, not SQLite: the ledger's invariants are database
# triggers. The service container mirrors erp-backend/docker-compose.yml (Postgres 16,
# C collation) so ordering in reports cannot differ between a laptop and CI.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR supersedes the run before it. Runs on main are never cancelled: each
# one is the check of a merge that has already happened.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: erp-backend

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oscenia
          POSTGRES_PASSWORD: oscenia
          POSTGRES_DB: oscenia_erp
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U oscenia -d oscenia_erp"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      # Same URLs as .env.example; the suite creates oscenia_erp_test itself on first run.
      DATABASE_URL: postgresql+asyncpg://oscenia:oscenia@localhost:5433/oscenia_erp
      TEST_DATABASE_URL: postgresql+asyncpg://oscenia:oscenia@localhost:5433/oscenia_erp_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: erp-backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy app

      - name: Pytest
        run: pytest -q

  image:
    name: API image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The deploy builds this on the VPS; a broken Dockerfile should fail here instead.
      - name: Build
        run: docker build --tag oscenia-api:ci erp-backend

      - name: Refuses to start with development secrets
        run: |
          if docker run --rm oscenia-api:ci python -c "from app.core.config import get_settings; get_settings()"; then
            echo "the production image started with the development secrets" >&2; exit 1
          fi

  frontend:
    name: Frontend (verify, render, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: erp-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: erp-frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify (ledger, flows, adapters, chat, events, proto)
        run: npm run verify

      - name: Render every route
        run: npm run verify:render

      - name: Production build
        run: npx vite build

  website:
    name: Website (lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npx oxlint src

      - name: Production build
        run: npx vite build

  edge:
    name: Edge image builds (website + ERP + Caddy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The deploy builds this on the VPS; a broken bundle or Dockerfile should fail here instead.
      - name: Build
        run: docker build --file deploy/Dockerfile.edge --tag oscenia-edge:ci .

      - name: Caddyfile is valid
        run: |
          docker run --rm -e SITE_DOMAIN=example.com -e STAGING_SITE_DOMAIN=staging.example.com             -e ACME_EMAIL=ci@example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"             oscenia-edge:ci caddy validate --config /etc/caddy/Caddyfile
